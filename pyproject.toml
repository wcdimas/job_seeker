[tool.poetry]
name = "job-seeker"
version = "0.1.0"
description = "LinkedIn post search and analysis"
authors = ["User <user@example.com>"]
readme = "README.md"
packages = [{include = "job_seeker", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
selenium = "^4.18.0"
webdriver-manager = "^4.0.1"
beautifulsoup4 = "^4.12.3"
pandas = "^2.2.0"
python-dotenv = "^1.2.2"
google-genai = "^2.6.0"
pydantic = "^2.13.4"
tabulate = "^0.10.0"
o365 = "^2.1.9"
fastapi = "^0.136.3"
uvicorn = "^0.48.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
